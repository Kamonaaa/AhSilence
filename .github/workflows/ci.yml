name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android NDK 27.1
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Revert Broken Dependabot Upgrades
        run: |
          sed -i 's/lifecycleRuntimeKtx = "2.11.0"/lifecycleRuntimeKtx = "2.8.7"/' gradle/libs.versions.toml
          sed -i 's/coroutines = "1.11.0"/coroutines = "1.8.1"/' gradle/libs.versions.toml
          sed -i 's/composeBom = "2026.06.01"/composeBom = "2024.09.00"/' gradle/libs.versions.toml

      - name: Fix Gradlew Permissions
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x checkDebugAarMetadata --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
